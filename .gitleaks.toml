# Settings for the secret scan in CI (gitleaks-action in .github/workflows/ci.yml). The default rules stay on.
title = "HCML portal secret scan"

[extend]
useDefault = true

# Two made-up test values, each named by its own text so that a real secret in the same file, or the same kind of
# secret anywhere else, is still found: a throwaway TLS key for the pinned-TLS tests (server/src/__tests__/helpers/
# tlsTestCerts.ts), and a JWT-shaped string that the log-redaction test hands to the logger (logging.test.ts).
[allowlist]
description = "Made-up test values: a throwaway TLS key and a sample JWT. Neither opens anything."
regexes = [
  '''-----BEGIN PRIVATE KEY-----\s*MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgkjgAf7Lx4FihDvoL''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJub2MiLCJyb2xlIjoidmlld2VyIn0\.c2lnbmF0dXJl''',
]
