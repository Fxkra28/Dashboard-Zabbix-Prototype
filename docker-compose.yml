# HCML Monitoring Portal, deploy next to Zabbix.
# portal-web (nginx) serves the built React app and reverse-proxies /bff -> portal-bff.
# The browser only ever talks to portal-web; the Zabbix token stays inside portal-bff.

# Container logs are rotated so a chatty BFF cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  portal-bff:
    build:
      context: ./server
      # Shown by /api/health to a signed-in user. Set them when you build:
      #   BUILD_COMMIT=$(git rev-parse --short HEAD) BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker compose up -d --build
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    # tini as PID 1 hands SIGTERM to node and reaps its children.
    init: true
    # Linux has no host.docker.internal of its own: host-gateway makes it the host, which
    # is how ZBX_URL below (and a local AI_BASE_URL) reach what the host publishes. Docker
    # Desktop already defines the name, so on a Mac or Windows this changes nothing.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The Zabbix stack runs in its own compose project (Proto1/docker-compose.yml),
      # so there is no shared network and no DNS between the two. The portal
      # reaches Zabbix over the host's published 8080 instead, by the name above.
      # On Linux that name is the Docker bridge, which a port published on 127.0.0.1
      # only does not answer on: publish Zabbix's 8080 on the bridge too, or point
      # this at the Zabbix host's real address.
      ZBX_URL: ${ZBX_URL:-http://host.docker.internal:8080/api_jsonrpc.php}
      # Canonical name. ZBX_TOKEN is a deprecated alias that trips a startup
      # warning on every boot, so it is deliberately not what compose passes.
      ZABBIX_API_TOKEN: ${ZABBIX_API_TOKEN:-}
      # Without this, acknowledge/close is permanently 503 in Docker no matter
      # what .env holds: the portal silently loses its only write.
      ZABBIX_WRITE_TOKEN: ${ZABBIX_WRITE_TOKEN:-}
      ZABBIX_TIMEOUT_MS: ${ZABBIX_TIMEOUT_MS:-10000}
      PORT: "4000"
      # Node sizes its default heap from the container's memory limit and takes only part of
      # it, so mem_limit alone would leave the biggest report build short of what the limit
      # allows. 1280 MiB of heap keeps room in the 2g for buffers, /tmp and the runtime.
      NODE_OPTIONS: "--max-old-space-size=1280"
      # nginx sits in front, so honour X-Forwarded-For: otherwise every request
      # looks like it comes from the proxy and all users share one rate limit.
      # true is one hop (nginx). Set TRUST_PROXY=2 in .env with a TLS proxy in front,
      # and have that proxy keep the browser's Host (setup.md section 23).
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      # Live screens allowed at once, overall and per signed-in user (routes/stream.ts).
      STREAM_MAX_CLIENTS: ${STREAM_MAX_CLIENTS:-100}
      STREAM_MAX_PER_USER: ${STREAM_MAX_PER_USER:-5}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8081}
      NET_GROUP_IDS: ${NET_GROUP_IDS:-}
      SITE_TAG: ${SITE_TAG:-site}
      SITE_GROUP_PREFIX: ${SITE_GROUP_PREFIX:-}
      OWNER_TAG: ${OWNER_TAG:-owner}
      CRITICALITY_TAG: ${CRITICALITY_TAG:-criticality}
      HOST_NAME_PATTERN: ${HOST_NAME_PATTERN:-}
      LINK_LOSS_WARN: ${LINK_LOSS_WARN:-2}
      LINK_LOSS_CRIT: ${LINK_LOSS_CRIT:-10}
      # The Zabbix dashboard whose gauge widgets are the internet traffic meters (routes/meters.ts).
      INTERNET_METERS_DASHBOARD: ${INTERNET_METERS_DASHBOARD:-Global view}
      NOISE_SHORT_SECONDS: ${NOISE_SHORT_SECONDS:-300}
      NOISE_MIN_COUNT: ${NOISE_MIN_COUNT:-5}
      AVAILABILITY_MIN_SEVERITY: ${AVAILABILITY_MIN_SEVERITY:-2}
      # The derived monthly SLA (sli/engine.ts). The BFF reads these but compose
      # never passed them, so a value in .env changed nothing in Docker.
      # Each default is config.ts's own; a test keeps the two equal.
      SLO_TARGET: ${SLO_TARGET:-99}
      SLA_TIMEZONE: ${SLA_TIMEZONE:-Asia/Jakarta}
      SLI_PROFILE: ${SLI_PROFILE:-availability}
      SLI_REPORT_TRIGGERS: ${SLI_REPORT_TRIGGERS:-High ICMP ping loss}
      SLI_AVAILABILITY_TRIGGERS: ${SLI_AVAILABILITY_TRIGGERS:-Unavailable by ICMP ping,High ICMP ping loss}
      SLI_MIN_COVERAGE: ${SLI_MIN_COVERAGE:-0.5}
      SLI_ZBX_PARALLEL: ${SLI_ZBX_PARALLEL:-4}
      # Two backends behind one switch: "anthropic" (hosted, needs a key) or
      # "openai-compatible" (a local model, needs a URL). A local Ollama is
      # reached exactly the way Zabbix is above: the container cannot see the
      # host's localhost, so: AI_BASE_URL=http://host.docker.internal:11434/v1
      # On Linux, Ollama must also listen beyond loopback (OLLAMA_HOST=0.0.0.0:11434 for
      # the Ollama service, or the Docker bridge address), or the container gets no answer.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      # No defaults for these two on purpose. config.ts picks a different one
      # per backend (claude-sonnet-4-6 / 30 s hosted, qwen3:8b / 120 s local),
      # and a default here would override that and silently ask Ollama for a
      # Claude model. Empty falls through. See the `||` note on zbxUrl.
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      # Documented in both .env.example files but previously never passed here.
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      # Local-model tuning (config.ts, ai.ts), also never passed before. Same
      # rule: the defaults are config.ts's, and only a local model reads them.
      AI_KEEP_ALIVE: ${AI_KEEP_ALIVE:-30m}
      AI_OLLAMA_NATIVE: ${AI_OLLAMA_NATIVE:-auto}
      AI_NUM_CTX: ${AI_NUM_CTX:-8192}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_TOP_P: ${AI_TOP_P:-0.8}
      # Caps on Explain and the Assistant (server/src/limits.ts).
      # Per signed-in user a minute, calls in flight at once, and tokens a day
      # (0 turns a budget off; only the hosted API is counted).
      AI_CHAT_PER_MINUTE: ${AI_CHAT_PER_MINUTE:-10}
      AI_EXPLAIN_PER_MINUTE: ${AI_EXPLAIN_PER_MINUTE:-10}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-4}
      AI_DAILY_TOKENS_PER_USER: ${AI_DAILY_TOKENS_PER_USER:-500000}
      AI_DAILY_TOKENS_TOTAL: ${AI_DAILY_TOKENS_TOTAL:-2000000}
      # Deployed, not scaffolded: default auth ON here.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # No default on purpose. The BFF refuses to start on the placeholder
      # secret, and handing it one here would defeat that check: an
      # authenticated portal signing tokens with a value published in this repo
      # looks perfectly healthy while anyone can forge an admin token.
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env before deploying}
      PORTAL_USER: ${PORTAL_USER:-admin}
      # No default: the old one, admin, made admin/admin the sign-in. Unset now
      # reaches the BFF empty, and it refuses to start without a password
      # (unless PORTAL_USERS is set).
      PORTAL_PASS: ${PORTAL_PASS:-}
      PORTAL_USERS: ${PORTAL_USERS:-}
      # Cookies ignore ports, so hcml-portal-ollama on 8082 uses its own name.
      SESSION_COOKIE: ${SESSION_COOKIE:-hcml_session}
      # How long one sign-in lasts, in hours, and the number that ends every session when it is
      # raised. Each default is config.ts's own; a test keeps the two equal.
      SESSION_HOURS: ${SESSION_HOURS:-12}
      SESSION_EPOCH: ${SESSION_EPOCH:-1}
    expose:
      - "4000"
    # Healthy means the process answers. Whether Zabbix does too is `ready` in the
    # reply a signed-in user gets, and a restart would not fix that, so it never fails
    # this check. The check sends no sign-in and reads only the status.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Least privilege. This container holds both Zabbix tokens and the AI key, so it
    # runs as the image's non-root node user, with every Linux capability dropped, a
    # read-only root filesystem and no way to gain privileges. It writes no files; /tmp
    # is a small in-memory scratch space.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Room for the biggest month: the cache alone may hold 64 MiB (cache.ts), and an SLA
    # build keeps a month of events and trends in memory on top of that.
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    logging: *default-logging

  portal-web:
    build: ./web
    depends_on:
      portal-bff:
        condition: service_healthy
    ports:
      # Host port is overridable so both portal variants can run at once
      # (e.g. WEB_PORT=8082 for hcml-portal-ollama); keep WEB_ORIGIN in step.
      # Bound to 127.0.0.1: the portal shows production monitoring data and must
      # not be reachable from whatever network the machine joins. Put a real
      # reverse proxy with TLS in front before exposing it. The container side is
      # 8080, where the non-root nginx listens (web/nginx.conf); the host side is unchanged.
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    # Same hardening as portal-bff. nginx runs as uid 101, and its pid file and
    # temp files (a proxied report download is buffered to disk) live in /tmp, which is
    # in memory and counts against mem_limit.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    # wget ships with Alpine, so the check adds nothing to the image. 127.0.0.1, not
    # localhost: nginx listens on IPv4 only. Each check is one line in nginx's access log.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # Enable when scaling the cache / SSE fan-out (see instruct.md §2).
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
