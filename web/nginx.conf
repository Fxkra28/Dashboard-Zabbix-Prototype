# Serves the built React app and reverse-proxies /bff -> the BFF container.
# The browser only talks to this origin (same-origin /bff), so no CORS needed.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /bff/api/hosts -> http://portal-bff:4000/api/hosts  (trailing slash strips /bff)
  location /bff/ {
    proxy_pass http://portal-bff:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # With TRUST_PROXY=true the BFF rate-limits by this, per browser; without
    # it every client behind nginx shares one address and one limit.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE: don't buffer, keep the connection open.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Vite fingerprints every bundle (Maps-Mhezgn4X.js), so a changed file gets a
  # new name and these can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback so client-side routes (/problems, /network, …) work on refresh.
  # index.html is the one file whose name never changes, and it names the
  # bundles, so it must be revalidated every time. Without this, a browser kept
  # the pre-rebuild index.html, loaded the old Maps bundle, and every map host
  # still read "()" after the fix had shipped.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
