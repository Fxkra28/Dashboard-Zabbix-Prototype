# Serves the built React app and reverse-proxies /bff -> the BFF container.
# The browser only talks to this origin (same-origin /bff), so no CORS needed.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /bff/api/hosts -> http://portal-bff:4000/api/hosts  (trailing slash strips /bff)
  location /bff/ {
    proxy_pass http://portal-bff:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # SSE: don't buffer, keep the connection open.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # SPA fallback so client-side routes (/problems, /network, …) work on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
