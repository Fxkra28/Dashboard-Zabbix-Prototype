# Serves the built React app and reverse-proxies /bff -> the BFF container.
# The browser only talks to this origin (same-origin /bff), so no CORS needed.

# The live stream used to carry its token in the URL, and the stock log format
# records the whole request line. It sends the session cookie now, but a
# page loaded before that still sends ?token=, so this redaction stays, as the
# BFF's does (logging.ts).
map $request $request_redacted {
  "~^(?<before>.*[?&]token=)[^&\s]*(?<after>.*)$" "${before}redacted${after}";
  default $request;
}
log_format portal '$remote_addr - $remote_user [$time_local] "$request_redacted" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" rid=$request_id';

server {
  # 8080, not 80: the image runs nginx as a non-root user, which cannot bind a port
  # below 1024. Compose maps the host's 8081 or 8082 onto this.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log portal;

  # No nginx version in the Server header or on error pages.
  server_tokens off;

  # The app's own files, about a third of their size on the wire. /bff turns
  # this off: the BFF compresses its JSON itself (compress.ts), and the live
  # stream must reach the browser unbuffered.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Enforced since the report-only pass found nothing: nine pages loaded with no violation
  # (SC-24). `style-src 'unsafe-inline'` stays, because ECharts and React set inline styles.
  # No outside host is named: the fonts are served from /fonts/.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

  # Docker's own DNS, asked again every 10 s. nginx resolved `portal-bff` once at
  # startup, so recreating only the BFF (a new address) left /bff on 502 until
  # this container restarted. A proxy_pass that names a
  # variable is resolved per request, which is why the address is held in one.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $bff_upstream http://portal-bff:4000;

  # How long nginx waits for the BFF between two reads. A minute is far more than
  # any ordinary reply needs, and a call that stalls fails on its own instead of
  # holding a page for an hour. The streams and the explanations
  # below set their own.
  proxy_read_timeout 60s;

  # /bff/api/hosts -> http://portal-bff:4000/api/hosts. With a variable in
  # proxy_pass nginx no longer swaps the matched prefix for you, so the shared
  # include strips /bff itself. No add_header here: helmet already sets the
  # security headers on BFF replies.
  location /bff/ {
    include /etc/nginx/conf.d/bff-proxy.inc;
  }

  # The monthly SLA is computed from months of event history on the first request after
  # a restart, and the report download builds its file from it. Nobody has timed that on
  # HCML's real estate, so these wait as long as an explanation does. The page's own
  # deadline (SLI_TIMEOUT_MS in web/src/api.ts) stays below this (nginx-conf.test.ts).
  location /bff/api/sli {
    include /etc/nginx/conf.d/bff-proxy.inc;
    proxy_read_timeout 180s;
  }

  # An explanation waits on a language model. The BFF gives it 30 s (one retry)
  # on the hosted model and 120 s on a local one (AI_TIMEOUT_MS), so these outlast
  # an ordinary read. Raise this together with AI_TIMEOUT_MS and with EXPLAIN_TIMEOUT_MS
  # in web/src/api.ts, which must stay below it (nginx-conf.test.ts checks the order).
  location /bff/api/explain/ {
    include /etc/nginx/conf.d/bff-proxy.inc;
    proxy_read_timeout 180s;
  }

  # The live stream, on its own so its errors stay out of the error log: that
  # log writes the whole request line, with any ?token= an old page still sends,
  # every time the BFF is unreachable, and the access-log redaction cannot reach it.
  # An event stream stays open on purpose: no buffering, and an hour between two
  # reads (the BFF sends a ping after 15 s of silence).
  location = /bff/api/stream {
    include /etc/nginx/conf.d/bff-proxy.inc;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    error_log /var/log/nginx/error.log crit;
  }

  # The assistant's answer is an event stream too, and it can sit silent while a
  # local model loads, which an ordinary read timeout would cut off.
  location = /bff/api/chat {
    include /etc/nginx/conf.d/bff-proxy.inc;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # nginx drops inherited add_header lines in any location that sets its own,
  # so each location below repeats the four security headers.

  # Vite fingerprints every bundle (Maps-Mhezgn4X.js), so a changed file gets a
  # new name and these can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }

  # The typefaces (public/fonts). Not content-hashed either, so a month rather than for good: long enough
  # that a visit costs no font download, short enough that a replaced file reaches people.
  location /fonts/ {
    add_header Cache-Control "public, max-age=2592000";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }

  # A path with a dot-file segment (/.env, /.git/config, /x/.hidden) is never a page of the app.
  # Without this the fallback below answers each with the home page and a 200, so a scanner reports
  # every dotfile as found, and a real leak later would hide among them. /bff is left to the BFF.
  # Before the logo location: the first regex that matches wins.
  location ~ ^/(?!bff/)(.*/)?\. {
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    return 404;
  }

  # Brand assets. Not content-hashed the way /assets/ is, so they cannot be
  # immutable: replacing the logo has to reach people. A day of caching keeps
  # the 127 KB lockup off every page load without pinning a stale one for a year.
  location ~* ^/logo(-mark|-icon)?\.png$ {
    add_header Cache-Control "public, max-age=86400";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }

  # SPA fallback so client-side routes (/problems, /network, …) work on refresh.
  # index.html is the one file whose name never changes, and it names the
  # bundles, so it must be revalidated every time. Without this, a browser kept
  # the pre-rebuild index.html, loaded the old Maps bundle, and every map host
  # still read "()" after the fix had shipped.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri $uri/ /index.html;
  }
}
