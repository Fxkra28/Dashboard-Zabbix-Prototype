<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCML Monitoring Portal</title>
    <!--
      The H from the wordmark, cropped from the same file the sidebar uses. No
      wordmark is legible at 16px: the full lockup puts "Madura Limited" at
      3.2px. The tile is flattened onto white on purpose, because a transparent
      favicon disappears into dark browser chrome.
    -->
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <!-- Fonts are served from /fonts. A font preload needs crossorigin even from the same origin. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
